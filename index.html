<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06111d">
  <title>TraceVerity Mobile</title>

  <style>
    :root{
      --bg:#030c16;--card:#091827;--line:#1c4259;--text:#edfaff;
      --muted:#93adbd;--cyan:#18d0ef;--green:#42dc86;--yellow:#ffd147;
      --purple:#bb7cff;--orange:#ff9c3b;--pink:#ed69d8;--red:#fc626c;
      font-family:Tahoma,Arial,sans-serif;color:var(--text);background:var(--bg)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg)}
    button,input,select{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{
      outline:2px solid var(--cyan);outline-offset:3px
    }
    .app{
      max-width:520px;min-height:100svh;margin:auto;padding:0 16px 103px;
      overflow:hidden;position:relative;
      background:radial-gradient(circle at 50% -5%,#144c7566,transparent 33rem),
      linear-gradient(180deg,#06111e,#030b14)
    }
    .app:before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.07;
      background-image:linear-gradient(#9adaff18 1px,transparent 1px),
      linear-gradient(90deg,#9adaff18 1px,transparent 1px);
      background-size:31px 31px;mask-image:radial-gradient(circle at 50% 25%,black,transparent 72%)
    }
    .top{
      height:82px;display:flex;align-items:center;justify-content:space-between;
      position:relative;z-index:2
    }
    .brand{display:flex;align-items:center;gap:9px;direction:ltr}
    .mark{
      width:35px;height:35px;border:1px solid var(--cyan);border-radius:11px;
      display:grid;place-items:center;color:var(--cyan);font-size:24px;
      box-shadow:0 0 20px #18d0ef44
    }
    .brand b{display:block;font:800 18px Arial,sans-serif;letter-spacing:.8px;line-height:1}
    .brand em{color:var(--cyan);font-style:normal}
    .brand small{font-size:9px;color:#92adbd}
    .private{
      border:1px solid #2a546c;border-radius:17px;background:#0a1b2a;
      color:#b9eaf3;padding:7px 9px;font-size:10px
    }
    .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);
      box-shadow:0 0 9px var(--green);margin-left:4px}
    #main{position:relative;z-index:1}
    .hero,.card,.world,.report-hero,.report-list{
      border:1px solid var(--line);background:linear-gradient(135deg,#0b2030,#071421);
      border-radius:17px;box-shadow:0 20px 42px #0008
    }
    .hero{padding:18px 20px 20px;position:relative;overflow:hidden}
    .hero:after{content:"⌬";position:absolute;left:-18px;bottom:-47px;font-size:180px;color:#17d1ef0d}
    .eyebrow{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:bold;
      color:#7ee1ee;letter-spacing:.08em;margin:0 0 8px}
    .eyebrow i{width:17px;height:2px;background:var(--cyan);box-shadow:0 0 7px var(--cyan)}
    h1,h2,p{margin:0}
    .hero h1,.page-head h1{font-size:28px;line-height:1.36}
    .hero h1 em{color:var(--cyan);font-style:normal}
    .hero>p:not(.eyebrow),.page-head>div>p{font-size:12px;line-height:1.8;color:var(--muted);
      max-width:290px;margin-top:9px}
    .primary{
      margin-top:17px;padding:10px 13px;border:1px solid #15accb;border-radius:10px;
      background:linear-gradient(90deg,#064b67,#0f7899);color:#edffff;font-size:12px;
      display:flex;align-items:center;justify-content:space-between;gap:20px;text-decoration:none
    }
    .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:13px 0}
    .metric{border:1px solid #1a3d52;background:linear-gradient(135deg,#0b1b2a,#07131e);
      border-radius:13px;padding:13px;display:grid;grid-template-columns:auto 1fr;
      gap:2px 9px;align-items:center}
    .metric>span{grid-row:span 2;color:var(--tone);font-size:22px}
    .metric b{font-size:19px;line-height:1}.metric small{font-size:10px;color:var(--muted)}
    .cyan{--tone:var(--cyan)}.green{--tone:var(--green)}.purple{--tone:var(--purple)}.yellow{--tone:var(--yellow)}
    .card{padding:16px;margin-top:18px}.compact{padding-bottom:8px}
    .heading{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
    .heading h2{font-size:17px}.heading button{border:0;background:transparent;color:#73deed;font-size:11px}
    .network{
      height:250px;position:relative;margin-top:5px;border:0;background:transparent;color:white;width:100%
    }
    .network:before{
      content:"";position:absolute;inset:24px;border-radius:50%;
      background:radial-gradient(circle,#12649555,transparent 65%)
    }
    .ring{position:absolute;right:50%;top:50%;translate:50% -50%;border:1px dashed #2fd6ee5b;border-radius:50%}
    .r1{width:135px;height:135px}.r2{width:220px;height:220px;border-color:#5596b83b}
    .hub{
      position:absolute;right:50%;top:50%;translate:50% -50%;width:96px;height:96px;
      border:1px solid var(--cyan);border-radius:50%;display:grid;place-content:center;
      background:radial-gradient(circle at 50% 30%,#157cac,#082237 70%);
      box-shadow:0 0 0 6px #17ccef14,0 0 26px #17ccef58;font-size:23px
    }
    .hub b{font-size:12px;line-height:1.25}
    .node{
      position:absolute;width:48px;height:48px;border-radius:50%;border:1px solid var(--tone);
      display:grid;place-items:center;background:#0a1d2c;color:var(--tone);font-size:19px
    }
    .node small{position:absolute;top:53px;color:#a9c3d0;font-size:8px;white-space:nowrap}
    .n1{--tone:var(--red);right:calc(50% - 24px);top:2px}.n2{--tone:var(--purple);right:calc(50% - 124px);top:48px}
    .n3{--tone:var(--yellow);left:2px;top:127px}.n4{--tone:var(--orange);right:calc(50% - 124px);bottom:20px}
    .n5{--tone:var(--cyan);right:calc(50% + 53px);bottom:0}.n6{--tone:var(--pink);right:calc(50% + 130px);top:60px}
    .mini,.country-row,.source{
      width:100%;padding:11px 0;border:0;border-top:1px solid #17394e;background:transparent;
      color:var(--text);display:flex;align-items:center;gap:8px;text-align:right
    }
    .mini>span,.country-row>span{font-size:20px}
    .mini>div,.country-row>div,.source>div{flex:1;min-width:0}
    .mini>div,.country-row>div{display:grid;gap:3px}
    .mini b,.country-row b,.source b{font-size:11px}
    .mini small,.country-row small{font-size:9px;color:var(--muted)}
    .mini em,.country-row em,.source em{font-style:normal;color:#76d9e8;font-size:20px}
    .pill{border-radius:12px;padding:4px 6px;font-size:8px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
    .pill i{width:5px;height:5px;border-radius:50%;background:currentColor}
    .pill.documented{color:#76efad;background:#123d2a}.pill.review{color:#ffe27a;background:#483b1a}.pill.reported{color:#ff9aa6;background:#4b212b}
    .nav{
      position:fixed;z-index:20;bottom:0;right:50%;translate:50% 0;max-width:520px;width:100%;
      height:75px;padding:7px 18px max(7px,env(safe-area-inset-bottom));
      border-top:1px solid #17394e;background:#071421f2;backdrop-filter:blur(18px);
      display:flex;justify-content:space-between
    }
    .nav button{border:0;background:transparent;color:#6f8d9f;width:56px;display:grid;place-content:center;gap:3px}
    .nav button span{font-size:21px;line-height:1}.nav button small{font-size:9px}.nav button.active{color:var(--cyan)}
    .fab{
      position:fixed;z-index:25;bottom:90px;right:calc(50% - min(210px,calc(50vw - 20px)));
      width:48px;height:48px;border:1px solid #2acbea;border-radius:50%;
      background:linear-gradient(135deg,#0b8fb3,#07566f);color:#fff;font-size:31px;line-height:1
    }
    .page-head{padding:11px 1px 17px;display:flex;justify-content:space-between;gap:10px}
    .page-head>button{width:39px;height:39px;border:1px solid #2c8bab;border-radius:10px;background:#0b2e3e;color:#d6fcff;font-size:23px}
    .search{height:47px;border:1px solid #234c63;background:#081827;border-radius:10px;padding:0 12px;
      display:flex;align-items:center;gap:9px;color:#76a2b6}
    .search span{font-size:22px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:11px}
    .chips{display:flex;gap:7px;overflow:auto;padding:12px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
    .chips button{flex:none;border:1px solid #21465b;border-radius:18px;background:#091827;color:#a4bdca;padding:7px 10px;font-size:10px}
    .chips button.active{border-color:var(--cyan);background:#0b4055;color:#ecffff}
    .world{height:220px;overflow:hidden;position:relative;background:radial-gradient(circle at 58% 38%,#134e7066,transparent 32%),#061520}
    .grid{position:absolute;inset:0;background-image:linear-gradient(#7acfff0d 1px,transparent 1px),linear-gradient(90deg,#7acfff0d 1px,transparent 1px);background-size:19px 19px}
    .land{position:absolute;background:#36566c;border:1px solid #4c7288;opacity:.72;border-radius:48% 52% 42% 58% / 43% 35% 65% 57%}
    .a{width:86px;height:47px;left:-10px;top:43px}.b{width:49px;height:86px;left:61px;top:103px}.c{width:105px;height:54px;right:91px;top:39px}.d{width:68px;height:84px;right:120px;top:105px}
    .focus{position:absolute;width:137px;height:137px;right:55px;top:35px;border:1px solid var(--cyan);border-radius:50%;box-shadow:0 0 0 7px #18d0ef11,0 0 28px #18d0ef2c}
    .pin{position:absolute;width:27px;height:27px;border:1px solid #7beaf5;border-radius:50%;background:#0d2e42;display:grid;place-items:center;font-size:16px}
    .dk{right:113px;top:72px}.se{right:93px;top:52px}.no{right:129px;top:53px}.de{right:105px;top:96px}
    .map-label{position:absolute;bottom:11px;left:11px;right:11px;border:1px solid #1e4b62;border-radius:8px;background:#071a28e8;padding:8px 9px;display:flex;align-items:center;gap:6px;color:#a5c1ce;font-size:9px}
    .map-label b{margin-right:auto;color:#ecfcff}.results{margin-top:13px;padding:14px}
    .country-row{margin-top:8px;padding:10px;border:1px solid #1a3c50;border-radius:10px;background:#091827}
    .note{display:flex;gap:8px;margin:12px 4px;color:var(--muted);font-size:10px;line-height:1.7}.note i{width:16px;height:16px;border:1px solid #4d839b;border-radius:50%;display:grid;place-items:center;color:#91eff9;font-style:normal}
    .status-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.status-summary>div{border:1px solid #1d4258;background:#081725;border-radius:10px;padding:9px;display:grid;gap:7px}.status-summary b{font-size:18px}
    .source{padding:12px;border:1px solid #1b4055;border-radius:12px;background:linear-gradient(135deg,#0a1a29,#081522);gap:10px;margin-bottom:9px}
    .source-icon{width:38px;height:38px;flex:none;border:1px solid currentColor;border-radius:9px;display:grid;place-items:center;color:var(--cyan);font-size:19px}
    .source-icon.review{color:var(--yellow)}.source-icon.reported{color:var(--red)}
    .source>div>div{display:flex;gap:6px}.source p{margin-top:4px;color:#a0b8c5;font-size:9px}.source p i{font-style:normal;color:#567182}.source small{display:block;margin-top:5px;font-size:9px;color:#6cd7e8}
    .integrity{margin-top:13px;padding:13px;border:1px solid #4d4421;border-radius:13px;background:linear-gradient(135deg,#211d0f,#11180f);display:flex;gap:10px}.integrity>span{color:var(--yellow);font-size:20px}.integrity b{font-size:11px}.integrity p{margin-top:4px;color:#c0c9aa;font-size:10px;line-height:1.75}
    .report-hero{padding:19px;display:flex;align-items:center;gap:18px}.donut{width:122px;height:122px;flex:none;border-radius:50%;display:grid;place-items:center;position:relative}.donut:after{content:"";position:absolute;inset:13px;background:#0a1a29;border-radius:50%}.donut>div{z-index:1;text-align:center}.donut b{display:block;font-size:24px}.donut small{font-size:9px;color:var(--muted)}.report-hero h2{font-size:16px;line-height:1.6}
    .outline{margin-top:10px;border:1px solid #34748d;border-radius:8px;background:#0c2635;color:#c1f4fb;font-size:10px;padding:8px 9px}
    .report-list{padding:13px;margin-top:12px}.report{padding:8px 0;border-bottom:1px solid #17394d;display:flex;align-items:center;gap:8px;font-size:11px}.report:last-child{border:0}.report>i{width:8px;height:8px;border-radius:50%;background:var(--cyan)}.report>i.documented{background:var(--green)}.report>i.review{background:var(--yellow)}.report>i.reported{background:var(--red)}.report>span{flex:1;height:4px;border-radius:4px;background:#19394d}.report strong{font-size:16px}
    .step{position:relative;display:flex;gap:10px;padding:10px 0}.step:not(:last-child):after{content:"";position:absolute;right:13px;top:33px;width:1px;height:27px;background:#29576d}.step>i{width:27px;height:27px;z-index:1;display:grid;place-items:center;border:1px solid #3d7790;border-radius:50%;background:#0c2131;color:#a2dbe6;font-size:10px;font-style:normal}.step>i.done{border-color:var(--green);color:#87f6b8}.step b{font-size:11px;display:block}.step small{display:block;margin-top:3px;color:var(--muted);font-size:9px}
    .overlay{position:fixed;z-index:50;inset:0;display:flex;justify-content:center;align-items:flex-end}.scrim{position:absolute;inset:0;border:0;background:#000b;backdrop-filter:blur(4px)}
    .sheet{position:relative;z-index:1;width:min(520px,100%);max-height:88svh;overflow:auto;padding:19px 19px max(22px,env(safe-area-inset-bottom));border:1px solid #2c637c;border-bottom:0;border-radius:21px 21px 0 0;background:linear-gradient(145deg,#10283a,#071522 63%)}
    .grab{display:block;width:38px;height:4px;border-radius:5px;background:#537c8e;margin:0 auto 15px}.x{position:absolute;left:15px;top:14px;width:27px;height:27px;border:1px solid #355f74;border-radius:50%;background:#102b3b;color:#d0eef4;font-size:19px}.sheet-top{display:flex;align-items:center;gap:5px;color:#b4ceda;font-size:10px}.sheet-top>span{font-size:18px}.sheet-top .pill{margin-right:auto}.sheet h2{font-size:21px;line-height:1.5;margin-top:8px;padding-left:29px}.sheet>p:not(.eyebrow){margin-top:9px;color:#a0b8c5;font-size:11px;line-height:1.9}
    .sheet-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:15px 0}.sheet-stats>div{padding:10px;border:1px solid #1f485e;border-radius:9px;background:#091a29;text-align:center}.sheet-stats b{display:block;min-height:18px;font-size:16px}.sheet-stats small{display:block;margin-top:4px;color:var(--muted);font-size:9px}.origin{padding:10px;border:1px solid #1e4c62;border-radius:10px;background:#071927;display:flex;align-items:center;gap:9px}.origin>span{font-size:21px;color:var(--cyan)}.origin small{display:block;color:#83a8b9;font-size:9px}.origin b{display:block;margin-top:3px;font-size:11px}.wide{width:100%;margin-top:11px}.warning{display:block;text-align:center;margin-top:13px;color:#8eaab9;font-size:9px}
    .form-sheet form{display:grid;gap:11px;margin-top:15px}.form-sheet label{display:grid;gap:6px;color:#c0dbe5;font-size:10px}.form-sheet input,.form-sheet select{height:41px;border:1px solid #29566d;border-radius:8px;outline:0;background:#081927;color:var(--text);padding:0 10px;font-size:11px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toast{position:fixed;z-index:70;bottom:100px;right:50%;translate:50% 90px;padding:10px 13px;border:1px solid #408caa;border-radius:9px;background:#103a4e;color:#ecffff;font-size:10px;transition:translate .25s;white-space:nowrap}.toast.show{translate:50% 0}
    @media(min-width:700px){body{padding:25px;background:radial-gradient(circle at 50% 10%,#16476e,transparent 38rem),var(--bg)}.app{border:1px solid #205068;border-radius:26px;box-shadow:0 30px 80px #0009;min-height:850px}.nav{border-radius:0 0 26px 26px}.fab{right:calc(50% - 214px)}}
  </style>
</head>

<body>
  <main class="app">
    <header class="top">
      <div class="brand">
        <span class="mark">⌬</span>
        <div>
          <b>TRACE<em>VERITY</em></b>
          <small>شواهد • روابط • اسناد</small>
        </div>
      </div>
      <button class="private" id="private"><i class="dot"></i> خصوصی</button>
    </header>

    <section id="main"></section>

    <button class="fab" id="add" aria-label="افزودن لینک">+</button>

    <nav class="nav">
      <button data-tab="home"><span>⌂</span><small>خانه</small></button>
      <button data-tab="map"><span>⌬</span><small>نقشه</small></button>
      <button data-tab="sources"><span>⌕</span><small>منابع</small></button>
      <button data-tab="report"><span>▤</span><small>گزارش</small></button>
    </nav>

    <div id="modal"></div>
    <div class="toast" id="toast"></div>
  </main>

  <script>
    const flags = {
      "دانمارک":"🇩🇰",
      "سوئد":"🇸🇪",
      "نروژ":"🇳🇴",
      "آلمان":"🇩🇪",
      "اروپا":"🇪🇺"
    };

    const statusLabels = {
      documented:"دارای سند",
      review:"در حال بررسی",
      reported:"گزارش‌شده"
    };

    const defaultItems = [
      {
        id:"DK-01",
        title:"ثبت‌های عمومی و سازمان‌ها",
        country:"دانمارک",
        category:"سازمان‌ها",
        status:"documented",
        source:"CVR / Virk",
        url:"https://datacvr.virk.dk/",
        docs:12,
        links:8,
        note:"نمونهٔ مسیر بررسی: ثبت قانونی، نام حقوقی، آدرس و اطلاعات نسخه‌دار."
      },
      {
        id:"DK-02",
        title:"املاک و دارایی‌های ثبت‌شده",
        country:"دانمارک",
        category:"املاک و دارایی",
        status:"review",
        source:"Tinglysning",
        url:"https://www.tinglysning.dk/",
        docs:7,
        links:6,
        note:"نمونهٔ مسیر بررسی: سند مالکیت، شماره ملک و تاریخ دریافت مدرک."
      },
      {
        id:"SE-01",
        title:"ثبت‌های نهادی سوئد",
        country:"سوئد",
        category:"سازمان‌ها",
        status:"documented",
        source:"Bolagsverket",
        url:"https://bolagsverket.se/",
        docs:9,
        links:5,
        note:"نقطهٔ شروع برای تطبیق نام نهادها با ثبت رسمی کشور."
      },
      {
        id:"NO-01",
        title:"ثبت و گزارش‌های نروژ",
        country:"نروژ",
        category:"اسناد",
        status:"review",
        source:"Brønnøysundregistrene",
        url:"https://www.brreg.no/",
        docs:6,
        links:4,
        note:"سند، گزارش و برداشت تحلیلی را جدا نگه دارید."
      },
      {
        id:"DE-01",
        title:"منابع ثبت و گزارش آلمان",
        country:"آلمان",
        category:"اسناد",
        status:"reported",
        source:"Bundesanzeiger",
        url:"https://www.bundesanzeiger.de/",
        docs:5,
        links:3,
        note:"گزارش ثانوی باید از سند رسمی جدا باشد."
      }
    ];

    let personalLinks = [];

    try {
      personalLinks = JSON.parse(
        localStorage.getItem("traceverity-github-links") || "[]"
      );
    } catch (error) {}

    let items = [...defaultItems, ...personalLinks];
    let currentTab = "home";
    let currentSearch = "";
    let currentCountry = "همه";

    const main = document.querySelector("#main");
    const modal = document.querySelector("#modal");

    function safeUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : null;
      } catch (error) {
        return null;
      }
    }

    function pill(status) {
      return `<span class="pill ${status}">
        <i></i>${statusLabels[status]}
      </span>`;
    }

    function filteredItems() {
      return items.filter(item => {
        const text = `${item.title} ${item.source} ${item.category}`.toLowerCase();
        const countryMatch =
          currentCountry === "همه" || item.country === currentCountry;

        return countryMatch && text.includes(currentSearch.trim().toLowerCase());
      });
    }

    function heading(top, title, action = "") {
      return `
        <header class="heading">
          <div>
            <p class="eyebrow"><i></i>${top}</p>
            <h2>${title}</h2>
          </div>
          ${action ? `<button data-action="${action}">
            ${action === "map" ? "نقشه ←" : "+"}
          </button>` : ""}
        </header>
      `;
    }

    function searchBox(placeholder) {
      return `
        <label class="search">
          <span>⌕</span>
          <input id="search" value="${currentSearch}" placeholder="${placeholder}">
        </label>
      `;
    }

    function renderHome() {
      const docs = items.reduce((sum, item) => sum + item.docs, 0);
      const countryCount = new Set(items.map(item => item.country)).size;

      main.innerHTML = `
        <section class="hero">
          <p class="eyebrow"><i></i>فضای تحقیق تعاملی</p>
          <h1>نقشهٔ تحقیق<br>در <em>جیب شما</em></h1>
          <p>با لمس هر بخش، منابع، وضعیت مدرک و رابطه‌های نیازمند بررسی را باز کن.</p>
          <button class="primary" data-go="map">
            باز کردن نقشه <b>←</b>
          </button>
        </section>

        <section class="metrics">
          <article class="metric cyan"><span>◎</span><b>${countryCount}</b><small>کشور و حوزه</small></article>
          <article class="metric green"><span>▦</span><b>${items.length}</b><small>رکورد و منبع</small></article>
          <article class="metric purple"><span>▤</span><b>${docs}</b><small>سند نمونه</small></article>
          <article class="metric yellow"><span>↗</span><b>${items.filter(item => safeUrl(item.url)).length}</b><small>لینک زنده</small></article>
        </section>

        <section class="card">
          ${heading("هستهٔ شبکه", "از کجا شروع کنیم؟", "map")}

          <button class="network" data-go="map" aria-label="باز کردن نقشه">
            <i class="ring r1"></i>
            <i class="ring r2"></i>

            <div class="hub">⌬<b>شبکهٔ<br>پژوهش</b></div>

            <span class="node n1">◈<small>نهادها</small></span>
            <span class="node n2">⌂<small>آموزش</small></span>
            <span class="node n3">◉<small>رسانه</small></span>
            <span class="node n4">¤<small>دارایی</small></span>
            <span class="node n5">▤<small>اسناد</small></span>
            <span class="node n6">♟<small>افراد</small></span>
          </button>
        </section>

        <section class="card compact">
          ${heading("تازه‌ترین‌ها", "کارت‌های پژوهش")}

          ${items.slice(0, 3).map(item => `
            <button class="mini" data-item="${item.id}">
              <span>${flags[item.country]}</span>
              <div><b>${item.title}</b><small>${item.source}</small></div>
              ${pill(item.status)}
              <em>←</em>
            </button>
          `).join("")}
        </section>
      `;
    }

    function renderMap() {
      const visible = filteredItems();
      const countries = ["همه", "دانمارک", "سوئد", "نروژ", "آلمان", "اروپا"];

      main.innerHTML = `
        <section class="page-head">
          <div>
            <p class="eyebrow"><i></i>جغرافیا و روابط</p>
            <h1>نقشهٔ موبایلی</h1>
            <p>کشور یا موضوع را انتخاب کن تا گره‌های مربوط باز شوند.</p>
          </div>
        </section>

        ${searchBox("جست‌وجوی موضوع، کشور یا منبع…")}

        <div class="chips">
          ${countries.map(name => `
            <button class="${currentCountry === name ? "active" : ""}" data-country="${name}">
              ${name === "همه" ? name : `${flags[name]} ${name}`}
            </button>
          `).join("")}
        </div>

        <section class="world">
          <div class="grid"></div>
          <div class="land a"></div>
          <div class="land b"></div>
          <div class="land c"></div>
          <div class="land d"></div>

          <i class="focus"></i>
          <span class="pin dk">🇩🇰</span>
          <span class="pin se">🇸🇪</span>
          <span class="pin no">🇳🇴</span>
          <span class="pin de">🇩🇪</span>

          <div class="map-label">
            <i class="dot"></i>
            حوزهٔ اروپا
            <b>${visible.length} رکورد</b>
          </div>
        </section>

        <section class="card results">
          ${heading(
            currentCountry === "همه" ? "همهٔ حوزه‌ها" : currentCountry,
            `${visible.length} گره قابل کاوش`
          )}

          ${visible.length ? visible.map(item => `
            <button class="country-row" data-item="${item.id}">
              <span>${flags[item.country]}</span>
              <div>
                <b>${item.title}</b>
                <small>${item.category} • ${item.docs} سند</small>
              </div>
              ${pill(item.status)}
              <em>‹</em>
            </button>
          `).join("") : `<p style="color:#93adbd;font-size:12px;padding:20px 0">چیزی پیدا نشد.</p>`}
        </section>

        <p class="note"><i>i</i>رنگ و وضعیت کارت، درجهٔ بررسی را نشان می‌دهد؛ نه اثبات قطعی یک ادعا.</p>
      `;
    }

    function renderSources() {
      const visible = filteredItems();

      main.innerHTML = `
        <section class="page-head">
          <div>
            <p class="eyebrow"><i></i>منابع زنده</p>
            <h1>سند، لینک، مسیر</h1>
            <p>روی هر کارت بزن تا منبع اصلی در پنجرهٔ جدا باز شود.</p>
          </div>

          <button data-action="add">+</button>
        </section>

        ${searchBox("جست‌وجو در همهٔ منابع…")}

        <section class="status-summary">
          ${["documented", "review", "reported"].map(status => `
            <div>
              ${pill(status)}
              <b>${visible.filter(item => item.status === status).length}</b>
            </div>
          `).join("")}
        </section>

        <section>
          ${visible.length ? visible.map(item => `
            <button class="source" data-item="${item.id}">
              <span class="source-icon ${item.status}">▤</span>
              <div>
                <div><b>${item.title}</b>${pill(item.status)}</div>
                <p>${item.source} <i>•</i> ${item.country}</p>
                <small>↗ لینک زنده</small>
              </div>
              <em>‹</em>
            </button>
          `).join("") : `<p style="color:#93adbd;padding:20px 0">چیزی پیدا نشد.</p>`}
        </section>

        <section class="integrity">
          <span>⚖</span>
          <div>
            <b>قاعدهٔ کار</b>
            <p>گزارش یا هم‌زمانی به‌تنهایی اثبات رابطه نیست. منبع، تاریخ و نسخه را نگه دار.</p>
          </div>
        </section>
      `;
    }

    function renderReport() {
      const documented = items.filter(item => item.status === "documented").length;
      const review = items.filter(item => item.status === "review").length;
      const reported = items.filter(item => item.status === "reported").length;
      const total = Math.max(items.length, 1);
      const percent = Math.round(documented / total * 100);
      const docs = items.reduce((sum, item) => sum + item.docs, 0);

      function reportRow(status, text, number) {
        return `
          <div class="report">
            <i class="${status}"></i>
            <b>${text}</b>
            <span></span>
            <strong>${number}</strong>
          </div>
        `;
      }

      main.innerHTML = `
        <section class="page-head">
          <div>
            <p class="eyebrow"><i></i>مرور وضعیت</p>
            <h1>گزارش پژوهش</h1>
            <p>یک نگاه سریع به آن‌چه مستند است و آن‌چه هنوز نیاز به کار دارد.</p>
          </div>
        </section>

        <section class="report-hero">
          <div class="donut" style="background:conic-gradient(
            var(--green) 0 ${percent}%,
            var(--yellow) ${percent}% ${percent + review / total * 100}%,
            var(--red) 0
          )">
            <div><b>${percent}%</b><small>دارای سند</small></div>
          </div>

          <div>
            <p class="eyebrow"><i></i>وضعیت اطلاعات</p>
            <h2>پیش از انتشار، دوباره بررسی کن.</h2>
            <button class="outline" data-go="map">بازگشت به نقشه ←</button>
          </div>
        </section>

        <section class="report-list">
          ${reportRow("documented", "دارای سند", documented)}
          ${reportRow("review", "در حال بررسی", review)}
          ${reportRow("reported", "گزارش‌شده", reported)}
          ${reportRow("live", "کل سند نمونه", docs)}
        </section>

        <section class="card">
          ${heading("خط زمان", "مرحله‌های پیشنهادی")}

          ${[
            "ثبت منبع اصلی",
            "افزودن مدرک و نسخه",
            "بررسی رابطه و پاسخ",
            "گزارش قابل انتشار"
          ].map((step, index) => `
            <div class="step">
              <i class="${index === 0 ? "done" : ""}">${index + 1}</i>
              <div>
                <b>${step}</b>
                <small>${index === 0 ? "برای هر موضوع یک منبع تاریخ‌دار ثبت کن." : "بعد از کامل شدن مرحلهٔ پیش برو جلو."}</small>
              </div>
            </div>
          `).join("")}
        </section>
      `;
    }

    function render() {
      document.querySelectorAll(".nav button").forEach(button => {
        button.classList.toggle("active", button.dataset.tab === currentTab);
      });

      if (currentTab === "home") renderHome();
      if (currentTab === "map") renderMap();
      if (currentTab === "sources") renderSources();
      if (currentTab === "report") renderReport();

      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll("[data-tab]").forEach(button => {
        button.onclick = () => {
          currentTab = button.dataset.tab;
          currentSearch = "";
          render();
        };
      });

      document.querySelectorAll("[data-go]").forEach(button => {
        button.onclick = () => {
          currentTab = button.dataset.go;
          currentSearch = "";
          render();
        };
      });

      document.querySelectorAll("[data-country]").forEach(button => {
        button.onclick = () => {
          currentCountry = button.dataset.country;
          render();
        };
      });

      document.querySelectorAll("[data-item]").forEach(button => {
        button.onclick = () => {
          const item = items.find(item => item.id === button.dataset.item);
          if (item) openItem(item);
        };
      });

      document.querySelectorAll("[data-action='add']").forEach(button => {
        button.onclick = openAdd;
      });

      const search = document.querySelector("#search");

      if (search) {
        search.oninput = event => {
          currentSearch = event.target.value;
          render();
        };
      }
    }

    function openItem(item) {
      const url = safeUrl(item.url);

      modal.innerHTML = `
        <div class="overlay">
          <button class="scrim" data-close></button>

          <section class="sheet">
            <i class="grab"></i>
            <button class="x" data-close>×</button>

            <div class="sheet-top">
              <span>${flags[item.country]}</span>
              ${item.country}
              ${pill(item.status)}
            </div>

            <h2>${item.title}</h2>
            <p>${item.note}</p>

            <div class="sheet-stats">
              <div><b>${item.docs}</b><small>مدرک</small></div>
              <div><b>${item.links}</b><small>رابطه</small></div>
              <div><b>${item.category}</b><small>دسته</small></div>
            </div>

            <div class="origin">
              <span>↗</span>
              <div>
                <small>منبع اصلی</small>
                <b>${item.source}</b>
              </div>
            </div>

            ${
              url
                ? `<a class="primary wide" href="${url}" target="_blank" rel="noopener">
                    باز کردن لینک زنده <b>↗</b>
                  </a>`
                : `<button class="primary wide" disabled>لینک قابل استفاده نیست</button>`
            }

            <small class="warning">این کارت یک مسیر پژوهش است، نه اثبات یک ادعا.</small>
          </section>
        </div>
      `;

      bindClose();
    }

    function openAdd() {
      modal.innerHTML = `
        <div class="overlay">
          <button class="scrim" data-close></button>

          <section class="sheet form-sheet">
            <i class="grab"></i>
            <button class="x" data-close>×</button>

            <p class="eyebrow"><i></i>منبع جدید</p>
            <h2>لینک زنده اضافه کن</h2>
            <p>این لینک فقط در مرورگر همین گوشی ذخیره می‌شود و بعداً می‌توانی آن را بررسی کنی.</p>

            <form id="addForm">
              <label>
                نام یا عنوان
                <input required name="title" placeholder="مثلاً ثبت رسمی…">
              </label>

              <label>
                لینک منبع
                <input required name="url" inputmode="url" placeholder="https://…">
              </label>

              <div class="form-grid">
                <label>
                  کشور
                  <select name="country">
                    ${Object.keys(flags).map(country => `<option>${country}</option>`).join("")}
                  </select>
                </label>

                <label>
                  دسته
                  <input name="category" value="پیوند و منبع">
                </label>
              </div>

              <button class="primary wide" type="submit">
                افزودن به منابع <b>+</b>
              </button>
            </form>
          </section>
        </div>
      `;

      bindClose();

      document.querySelector("#addForm").onsubmit = event => {
        event.preventDefault();

        const form = new FormData(event.target);
        const title = String(form.get("title") || "").trim();
        const url = safeUrl(String(form.get("url") || "").trim());
        const country = String(form.get("country") || "");

        if (!title || !url) {
          showToast("نام و یک لینک معتبر https:// وارد کن.");
          return;
        }

        const item = {
          id: "MY-" + Date.now(),
          title,
          country,
          category: String(form.get("category") || "پیوند و منبع"),
          status: "review",
          source: "لینک شخصی",
          url,
          docs: 1,
          links: 0,
          note: "این لینک در مرورگر شما ذخیره شد و پیش از نتیجه‌گیری نیاز به بررسی دارد."
        };

        personalLinks.push(item);
        items = [...defaultItems, ...personalLinks];

        localStorage.setItem(
          "traceverity-github-links",
          JSON.stringify(personalLinks)
        );

        modal.innerHTML = "";
        currentCountry = country;
        currentTab = "sources";
        currentSearch = "";
        render();
        showToast("لینک به فهرست منابع اضافه شد.");
      };
    }

    function bindClose() {
      modal.querySelectorAll("[data-close]").forEach(button => {
        button.onclick = () => {
          modal.innerHTML = "";
        };
      });
    }

    let toastTimer;

    function showToast(text) {
      const toast = document.querySelector("#toast");
      toast.textContent = text;
      toast.classList.add("show");

      clearTimeout(toastTimer);

      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    document.querySelector("#add").onclick = openAdd;

    document.querySelector("#private").onclick = () => {
      showToast("این نمونه در فضای تحقیق خصوصی است.");
    };

    render();
  </script>
</body>
</html>
